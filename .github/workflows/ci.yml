name: Validation

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p convex/tsconfig.json --noEmit
      - run: npm test -- --maxWorkers=1 --no-file-parallelism
      - run: npm run lint
      - run: npm run build
